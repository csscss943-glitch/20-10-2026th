وعي غير واجب وغير محدد بقدر",options:["الصدقة","الزكاة","الضريبة","النصاب"],answer:"الصدقة",explanation:"تطوع."});h({lesson:4,lessonTitle:d[4],type:"term",typeLabel:m.term,q:"الفئات الثمانية المستحقة للزكاة المذكورة في القرآن",options:["مصارف الزكاة","البنوك التجارية","شركات التأمين","البنية الناعمة"],answer:"مصارف الزكاة",explanation:"الفقراء والمساكين والعاملين عليها..."});h({lesson:4,lessonTitle:d[4],type:"term",typeLabel:m.term,q:"المسافر المنقطع عن بلده ونفد ماله",options:["ابن السبيل","الغارم","المؤلف قلبه","الرقاب"],answer:"ابن السبيل",explanation:"مستحق للزكاة."});h({lesson:4,lessonTitle:d[4],type:"term",typeLabel:m.term,q:"المدين العاجز عن سداد دينه",options:["الغارم","ابن السبيل","الفقير","العامل"],answer:"الغارم",explanation:"يُعطى من الزكاة لسداد دينه."});h({lesson:4,lessonTitle:d[4],type:"term",typeLabel:m.term,q:"زكاة واجبة على كل فرد في نهاية رمضان أساسها طعام",options:["زكاة الفطر","زكاة المال","الصدقة","الضريبة"],answer:"زكاة الفطر",explanation:"قوت البلد."});h({lesson:4,lessonTitle:d[4],type:"term",typeLabel:m.term,q:"حركة أموال الزكاة من المزكي للمستحق ثم إنفاقها كدخل في السوق",options:["الدورة الاقتصادية للزكاة","التضخم","المقايضة","الشمول المالي"],answer:"الدورة الاقتصادية للزكاة",explanation:"تدفق وتحريك الأموال."});h({lesson:4,lessonTitle:d[4],type:"term",typeLabel:m.term,q:"التزام مالي قانوني تفرضه الدولة لتمويل الخدمات العامة",options:["الضرائب","الزكاة","الصدقة","النصاب"],answer:"الضرائب",explanation:"مختلفة عن الزكاة في المصدر والمصرف."});h({lesson:4,lessonTitle:d[4],type:"mcq",typeLabel:m.mcq,q:"الشرط الأساسي المالي لنشوء وجوب أداء الزكاة هو",options:["وجود المال فقط","بلوغ الثروة حد النصاب وحولان الحول عليها","مرور يوم واحد","امتلاك عقار فقط"],answer:"بلوغ الثروة حد النصاب وحولان الحول عليها",explanation:"نصاب + حول."});h({lesson:4,lessonTitle:d[4],type:"mcq",typeLabel:m.mcq,q:"النسبة المئوية المقررة شرعاً لزكاة الأموال والذهب",options:["5%","2.5% (ربع العشر)","10%","1%"],answer:"2.5% (ربع العشر)",explanation:"نسبة زكاة المال."});h({less
